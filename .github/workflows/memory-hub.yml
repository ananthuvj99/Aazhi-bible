# Rebuilds the AAZHI Memory Hub (hub/) and publishes it to GitHub Pages
# on every push to main, and every 30 minutes so "active now" and ages stay fresh.
name: Memory Hub

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: memory-hub
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build hub/data.json from the repo and its history
        run: python3 hub/build_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hub
      - id: deployment
        uses: actions/deploy-pages@v4
